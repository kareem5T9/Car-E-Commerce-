name: ecommarce_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  firebase_core: ^4.0.0
  file_picker: ^10.3.1
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  mobkit_dashed_border: ^0.0.8
  http: ^1.5.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#121212"
  image: assets/images/photo.png
  android: true
  ios: true

  android_12:
    image: assets/images/photo.png
    color: "#121212"

    
  
